name: 测试并发布镜像

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oshino-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: after_sales_test
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d after_sales_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-postgres@127.0.0.1:5432/after_sales_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libgl1
          python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m "not live"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke test production images
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          JWT_SECRET: ci-only-jwt-secret-for-smoke-test-1234
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          export BACKEND_IMAGE="$base-backend:$GITHUB_SHA"
          export FRONTEND_IMAGE="$base-frontend:$GITHUB_SHA"
          export SERVER_ENV_FILE="$RUNNER_TEMP/oshino-smoke.env"
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$POSTGRES_PASSWORD" "$JWT_SECRET" > "$SERVER_ENV_FILE"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$BACKEND_IMAGE" backend
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$FRONTEND_IMAGE" -f frontend/Dockerfile.production frontend
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 180
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18734/ > /dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18734/api/health | jq -e '.status == "ok"'
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in backend frontend; do
            image="$base-$service:$GITHUB_SHA"
            docker push "$image"
          done

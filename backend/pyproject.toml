[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests", "migrations"]
venvPath = ".."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not postgres and not live' --tb=short"
markers = ["postgres: 需要本机专用 PostgreSQL 测试配置", "live: 需要外部真实服务", "basic_analysis: 测试后台基础分析"]
